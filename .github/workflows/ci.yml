name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # python3 viene en ubuntu-latest: lo usa el test que ejecuta el script de Fusion generado
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
